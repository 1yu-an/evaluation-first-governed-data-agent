name: CI Regression Gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install declared dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify Maven availability
        run: mvn --version

      - name: Run repository acceptance gate
        run: python scripts/acceptance_gate.py
